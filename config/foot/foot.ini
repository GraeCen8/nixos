# -*- conf -*-
# foot - Wayland native terminal (replaces the old X11 st + xwayland-satellite setup).
# Ported from the old st config.h: Rose Pine colors, JetBrainsMono Nerd Font,
# alpha 0.95, block cursor, Alt+c/v copy-paste, Ctrl+Shift+k/j font size,
# Ctrl+Shift+n spawns a new terminal in the same cwd (needs OSC 7 from shell).

[main]
term=foot
font=JetBrainsMono Nerd Font Mono:size=12
pad=2x2
initial-window-size-chars=80x24

[csd]
preferred=server

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
blink-rate=800

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
alpha=0.95
foreground=e0def4
background=191724
regular0=26233a
regular1=eb6f92
regular2=9ccfd8
regular3=f6c177
regular4=31748f
regular5=c4a7e7
regular6=ebbcba
regular7=e0def4
bright0=47435d
bright1=ff98ba
bright2=c5f9ff
bright3=ffeb9e
bright4=5b9ab7
bright5=eed0ff
bright6=ffe5e3
bright7=fefcff
selection-foreground=e0def4
selection-background=393552
cursor=191724 e0def4
flash=f6c177
flash-alpha=0.5

[key-bindings]
clipboard-copy=Mod1+c
clipboard-paste=Mod1+v
primary-paste=Shift+Insert
font-increase=Control+Shift+k Control+Shift+plus
font-decrease=Control+Shift+j Control+Shift+minus
font-reset=Control+Shift+Home
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f
