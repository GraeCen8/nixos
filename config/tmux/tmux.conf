# ~/.config/tmux/tmux.conf

# Omarchy-style tmux configuration
# Rose Pine status bar

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -sg escape-time 10
set -g pane-border-lines simple

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows / panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"

unbind %
bind = split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind x
bind x kill-pane

unbind X
bind X kill-window

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl pane navigation
bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Custom: New session (workspace) with rename prompt on prefix-n
unbind n
bind n command-prompt -p "New session name:" "new-session -s '%%'"


# Alt + number window selection
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"


# ============================================================
# Rose Pine
# Base:    #191724  Surface: #1f1d2e  Overlay: #26233a
# Muted:   #6e6a86  Subtle:  #908caa  Text:    #e0def4
# Love:    #eb6f92  Gold:    #f6c177  Rose:    #ebbcba
# Pine:    #31748f  Foam:    #9ccfd8  Iris:    #c4a7e7
# ============================================================

# ── Centered ─────────────────────────────────────────────────
# Status bar
set -g status on
set -g status-bg "#191724"
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Messages
set -g message-style "fg=#9ccfd8,bg=#26233a,align=right"
set -g message-command-style "fg=#9ccfd8,bg=#26233a,align=right"

# Panes
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"

# Windows
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[fg=#191724,bg=#c4a7e7] #I:#W "
set -g window-status-current-style "fg=#191724,bold"
set -g window-status-style "fg=#908caa"
set -g window-status-bell-style "fg=#eb6f92,bold"

# Right side
set -g status-right "#[fg=#c4a7e7]│ #[fg=#9ccfd8]#H "

# Left side
set -g status-left "#[fg=#c4a7e7]#S #[fg=#6e6a86]│ "

# Modes
set -g clock-mode-colour "#c4a7e7"
set -g mode-style "fg=#c4a7e7 bg=#393552 bold"


