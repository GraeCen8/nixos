<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>startpage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #191724;
      color: #e0def4;
      font-family: monospace;
      font-size: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .menu { width: 650px; }
    .title {
      color: #c4a7e7;
      text-align: center;
      margin-bottom: 16px;
    }
    a {
      display: flex;
      width: fit-content;
      margin: 0 auto;
      justify-content: center;
      text-decoration: none;
      color: #e0def4;
      padding: 1px 0;
      transition: color 0.1s;
    }
    a:hover { color: #9ccfd8; }
    .num { color: #eb6f92; width: 14px; text-align: right; margin-right: 4px; }
    .label { white-space: pre; }
  </style>
</head>
<body>
  <div class="menu">
    <div class="title">~ startpage ~</div>
    <a href="https://youtube.com"><span class="num">1</span><span class="label"> youtube   </span></a>
    <a href="https://teams.microsoft.com"><span class="num">2</span><span class="label"> teams     </span></a>
    <a href="https://gmail.com"><span class="num">3</span><span class="label"> gmail     </span></a>
    <a href="https://outlook.live.com"><span class="num">4</span><span class="label"> outlook   </span></a>
    <a href="https://www.onenote.com"><span class="num">5</span><span class="label"> onenote   </span></a>
    <a href="https://lichess.org"><span class="num">6</span><span class="label"> chess     </span></a>
    <a href="https://duckduckgo.com"><span class="num">7</span><span class="label"> duckduckgo</span></a>
    <a href="https://open.spotify.com"><span class="num">8</span><span class="label"> spotify   </span></a>
		<a href="https://qutebrowser.com/doc/help/"><span class="num">9</span><span class="label"> qute help </span></a>
  </div>
  <script>
    const sites = [
      "https://youtube.com",
      "https://teams.microsoft.com",
      "https://gmail.com",
      "https://outlook.live.com",
      "https://www.onenote.com",
      "https://lichess.org",
      "https://duckduckgo.com",
      "https://open.spotify.com",
      "https://qutebrowser.com/doc/help/"
    ];
    document.addEventListener("keydown", e => {
      const n = parseInt(e.key);
      if (n >= 1 && n <= sites.length) location.href = sites[n - 1];
    });
  </script>
</body>
</html>
